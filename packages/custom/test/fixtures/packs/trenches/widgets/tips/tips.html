<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JITO TIPS</title>
<style>
  body { margin: 0; background: var(--bg, #05070c); color: var(--text, #cfd8e3); font: 12px/1.4 ui-monospace, Menlo, monospace; }
  h1 { font-size: 12px; margin: 8px 10px; color: var(--accent, #ffb02e); letter-spacing: .08em; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 2px 10px; text-align: right; }
  th { color: var(--muted, #7a8699); font-weight: normal; }
  td:first-child, th:first-child { text-align: left; }
</style>
</head>
<body>
<h1>JITO TIP FLOOR · demo widget</h1>
<table><thead><tr><th>COIN</th><th>VOL 5M</th><th>TIP (sol)</th></tr></thead><tbody id="rows"><tr><td colspan="3">waiting for rows…</td></tr></tbody></table>
<script>
  // The widget API (task-1358 Tier 5): `dexterm.on(topic, fn)` delivers the host's view models; `dexterm.theme`
  // carries the terminal's theme tokens as CSS variables. No fetch, no imports, no eval: the popup host's CSP forbids them.
  // Plain <script>/<style> tags: the host allow-lists each inline block by its sha256 (there is no nonce to write).
  dexterm.on('rows', (rows) => {
    const body = document.getElementById('rows');
    body.textContent = '';
    for (const r of rows.slice(0, 12)) {
      const tr = document.createElement('tr');
      const tip = r.vol5m ? Math.max(0.0001, Math.min(0.05, r.vol5m / 5e6)).toFixed(4) : '—';
      for (const v of [r.symbol, r.vol5m == null ? '—' : Math.round(r.vol5m).toLocaleString(), tip]) { const td = document.createElement('td'); td.textContent = String(v); tr.appendChild(td); }
      body.appendChild(tr);
    }
  });
</script>
</body>
</html>
