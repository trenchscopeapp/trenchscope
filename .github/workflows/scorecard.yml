# OpenSSF Scorecard: weekly + on push to main; publishes the result so the README badge and
# https://scorecard.dev/viewer/?uri=github.com/<owner>/dexterm work. Only runs on a public repo.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 1'   # monday 06:30 utc
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    # private repos: the job token below has no contents permission (checkout fails) and results cannot be published
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish_results needs the OIDC token
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
