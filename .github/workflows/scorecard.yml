# OpenSSF Scorecard: weekly + on push to main; publishes the result so the README badge and
# https://scorecard.dev/viewer/?uri=github.com/<owner>/dexterm work. Only runs on a public repo.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 1'   # monday 06:30 utc
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    # private repos: the job token below has no contents permission (checkout fails) and results cannot be published
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish_results needs the OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
